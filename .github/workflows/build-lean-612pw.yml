          name: "AX3000T LEDE 正式版(passwall+6插件+自建第三方源 内核6.12) lean-612pw-3rdfeed-build-${{ github.run_number }}"
          body: |
            lede (coolsnowwolf/lede) master 滚动最新 + 原生大分区 xiaomi_mi-router-ax3000t。
