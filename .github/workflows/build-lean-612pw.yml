name: Build LEDE AX3000T (kernel 6.12 / big-partition / passwall + frpc)

# 基于 build-lean-612pw.yml（已编译成功的 passwall 版）。
# 本次按主人 2026-11-27 确认单：去 mosdns、加 frpc 0.72.0（不要中文语言包）；其余不变。
# 内核只留 sing-box / geoview / chinadns-ng；feed 加 passwall_packages + passwall_luci。
# 摘源：① video（第7条 404 坏源）注释；② passwall 两条源用 CONFIG_FEED_*=m 生成注释行，
# 出厂固件 distfeeds.conf 就不带 404 坏源（opkg update 全绿）。
# 内核/patch/BBR 注入全部沿用成功骨架。tag = lean-612pw-frpc-build-N。

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  DEVICE: xiaomi_mi-router-ax3000t
  KERNEL_VER: "6.12"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/hostedtoolcache/go \
            /usr/local/go /usr/local/share/powershell
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc gettext git \
            libncurses-dev libssl-dev libelf-dev make python3 python-is-python3 rsync unzip \
            zlib1g-dev file swig wget curl

      - name: Clone source (lede master, rolling - no commit pin)
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "=== source identity ==="
          git log -1 --format="commit: %h %ad %s" --date=short

      - name: "Pin kernel ${KERNEL_VER}"
        working-directory: openwrt
        run: |
          python3 - <<'PYEOF'
          import os
          ver = os.environ['KERNEL_VER']
          p = 'target/linux/mediatek/Makefile'
          s = open(p).read()
          old = 'KERNEL_PATCHVER:=6.18'
          new = 'KERNEL_PATCHVER:=' + ver
          assert old in s, '!! KERNEL_PATCHVER:=6.18 not found - upstream Makefile changed, patch needs review'
          open(p, 'w').write(s.replace(old, new, 1))
          print('pinned mediatek KERNEL_PATCHVER 6.18 ->', ver)
          PYEOF
          grep -n 'KERNEL_PATCHVER\|KERNEL_TESTING_PATCHVER' target/linux/mediatek/Makefile
          test -d target/linux/mediatek/patches-6.12 && echo "  OK patches-6.12"
          test -d target/linux/mediatek/files-6.12 && echo "  OK files-6.12"

      - name: "PATCH 1/2 - kernel mtk_bmt.c: support bmt-mtd-overridden-oobsize"
        working-directory: openwrt
        run: |
          python3 - <<'PYEOF'
          p = 'target/linux/generic/files/drivers/mtd/nand/mtk_bmt.c'
          s = open(p).read()
          anchor1 = 'int mtk_bmt_attach(struct mtd_info *mtd)\n{\n\tstruct device_node *np;\n\tint ret = 0;\n'
          repl1   = 'int mtk_bmt_attach(struct mtd_info *mtd)\n{\n\tstruct device_node *np;\n\tint ret = 0;\n\tu32 overridden_oobsize = 0;\n'
          assert s.count(anchor1) == 1, '!! anchor1 count != 1 (%d)' % s.count(anchor1)
          s = s.replace(anchor1, repl1, 1)
          anchor2 = '\tbmtd.mtd = mtd;\n\tmtk_bmt_replace_ops(mtd);\n\n\tbmtd.blk_size = mtd->erasesize;'
          repl2 = ('\tbmtd.mtd = mtd;\n\tmtk_bmt_replace_ops(mtd);\n\n'
                   '\tif (!of_property_read_u32(np, "mediatek,bmt-mtd-overridden-oobsize",\n'
                   '\t\t\t\t\t  &overridden_oobsize))\n'
                   '\t\tif (overridden_oobsize < bmtd.mtd->oobsize) {\n'
                   '\t\t\tbmtd.mtd->oobsize = overridden_oobsize;\n'
                   '\t\t\tpr_info("NMBM: mtd OOB size has been overridden to %luB\\n",\n'
                   '\t\t\t\t(long unsigned int)bmtd.mtd->oobsize);\n'
                   '\t\t}\n\n'
                   '\tbmtd.blk_size = mtd->erasesize;')
          assert s.count(anchor2) == 1, '!! anchor2 count != 1 (%d)' % s.count(anchor2)
          s = s.replace(anchor2, repl2, 1)
          open(p, 'w').write(s)
          print('PATCH1 applied')
          PYEOF
          grep -n 'overridden_oobsize\|bmt-mtd-overridden-oobsize' target/linux/generic/files/drivers/mtd/nand/mtk_bmt.c

      - name: "PATCH 2/2 - DTS: add mediatek,bmt-mtd-overridden-oobsize = <64>"
        working-directory: openwrt
        run: |
          python3 - <<'PYEOF'
          p = 'target/linux/mediatek/dts/mt7981b-xiaomi_mi-router.dtsi'
          s = open(p).read()
          anchor = '\t\tmediatek,nmbm;\n\t\tmediatek,bmt-max-ratio = <1>;\n\t\tmediatek,bmt-max-reserved-blocks = <64>;\n'
          repl   = anchor + '\t\tmediatek,bmt-mtd-overridden-oobsize = <64>;\n'
          assert s.count(anchor) == 1, '!! DTS anchor count != 1 (%d)' % s.count(anchor)
          assert 'bmt-mtd-overridden-oobsize' not in s, '!! already patched'
          open(p, 'w').write(s.replace(anchor, repl, 1))
          print('PATCH2 applied')
          PYEOF
          grep -n -A4 'mediatek,nmbm' target/linux/mediatek/dts/mt7981b-xiaomi_mi-router.dtsi

      - name: "Assert both NMBM fixes present before make"
        working-directory: openwrt
        run: |
          grep -q 'bmt-mtd-overridden-oobsize' target/linux/generic/files/drivers/mtd/nand/mtk_bmt.c || { echo "!! PATCH1 missing"; exit 1; }
          grep -q 'mediatek,bmt-mtd-overridden-oobsize = <64>' target/linux/mediatek/dts/mt7981b-xiaomi_mi-router.dtsi || { echo "!! PATCH2 missing"; exit 1; }
          echo "OK both NMBM fixes present"

      - name: "Init feeds (add passwall x2, DROP helloworld+video)"
        working-directory: openwrt
        run: |
          # passwall official feeds (author README: main + core packages)
          sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default
          sed -i '2i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' feeds.conf.default
          # helloworld DROPPED entirely: ssr-plus choice-block force-selects xray-core (主人明确不要).
          # video feed = the 7th software source (openwrt_video) that 404s on update -> drop.
          # NOTE: passwall feeds stay ACTIVE here (needed to compile the packages); their opkg
          # *runtime* sources are suppressed later via CONFIG_FEED_*=m (see strict gate step).
          sed -i '/src-git helloworld/s/^/#/' feeds.conf.default
          sed -i '/src-git video/s/^/#/' feeds.conf.default
          echo "=== active feeds ==="
          grep '^src-git' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # passwall marks many proxy cores "default y if aarch64"
          # (Xray / SSR / SimpleObfs / V2rayPlugin / Haproxy / SmartDNS...).
          # make defconfig turns them on even with "is not set" in the seed config.
          # Force ALL passwall optional cores to default n; we opt in ONLY
          # SingBox + Geoview + Nftables proxy explicitly in the config.
          PW_MK="feeds/passwall_luci/luci-app-passwall/Makefile"
          test -f "$PW_MK" || { echo "!! passwall Makefile missing at $PW_MK"; find feeds -path '*luci-app-passwall/Makefile' 2>/dev/null; exit 1; }
          sed -i -E 's/^([[:space:]]*)default y([[:space:]]+if .*)?$/\1default n/' "$PW_MK"
          echo "=== passwall optional core defaults (all should be default n) ==="
          grep -nE '^[[:space:]]*(config PACKAGE_|default [yn])' "$PW_MK" | head -60

          # sanity: needed packages must be available from the kept feeds
          for p in chinadns-ng geoview sing-box; do
            test -f "package/feeds/packages/$p/Makefile" || test -f "package/feeds/passwall_packages/$p/Makefile" || {
              echo "!! $p package missing from enabled feeds"; exit 1; }
            echo "  OK $p available"
          done
          # frpc/frp comes from lede's own packages feed
          test -f package/feeds/packages/frp/Makefile || { echo "!! frp Makefile missing"; exit 1; }
          echo "  OK frp (frpc) available"

      - name: "Bump frp to 0.72.0 (Lean feed ships 0.70.1)"
        working-directory: openwrt
        run: |
          # Verified in prior lean-build-3: go.mod needs go 1.26 (Lean golang = 1.27.3),
          # front-end build identical across versions. Patch PKG_VERSION + PKG_HASH.
          python3 - <<'PYEOF'
          p = 'feeds/packages/net/frp/Makefile'
          s = open(p).read()
          oldv, newv = '0.70.1', '0.72.0'
          oldh = '67246606f504cb15df72193f1a83911259e92b6a87838cff8850031efd406dc8'
          newh = '20e2249c2b17cb7624317b0a9a0baed06c80c547d27568d18a32c78e46d79230'
          assert 'PKG_VERSION:='+oldv in s, '!! frp version pattern not found (upstream moved)'
          assert 'PKG_HASH:='+oldh in s, '!! frp hash pattern not found (upstream moved)'
          s = s.replace('PKG_VERSION:='+oldv, 'PKG_VERSION:='+newv, 1)
          s = s.replace('PKG_HASH:='+oldh, 'PKG_HASH:='+newh, 1)
          open(p, 'w').write(s)
          print('patched', p, '->', newv)
          PYEOF
          grep -E 'PKG_VERSION:=|PKG_HASH:=' feeds/packages/net/frp/Makefile | head -2

      - name: "Load config (passwall + frpc version) + strict gate"
        working-directory: openwrt
        run: |
          cp ../config/ax3000t-lean-612pw.config .config
          make defconfig
          grep -q "DEVICE_${DEVICE}=y" .config || { echo "!! device not selected"; exit 1; }

          # --- Force passwall opkg runtime feeds to commented form (=m) AFTER defconfig.
          # Some OpenWrt versions normalize CONFIG_FEED_* in defconfig; re-assert here.
          # =m makes FeedSourcesAppendOPKG emit "# src/gz ..." (commented, no 404 on update).
          # Does NOT affect compilation (packages are compiled in via CONFIG_PACKAGE_*=y).
          python3 - <<'PYEOF'
          p = '.config'
          lines = open(p).read().splitlines()
          for feed in ('passwall_packages', 'passwall_luci'):
              key = 'CONFIG_FEED_' + feed + '='
              found = False
              for i, ln in enumerate(lines):
                  if ln.startswith(key) or ln == '# ' + key.rstrip('=') + ' is not set':
                      lines[i] = key + 'm'
                      found = True
              if not found:
                  lines.append(key + 'm')
              print('force', key + 'm', 'was_found=' + str(found))
          open(p, 'w').write('\n'.join(lines) + '\n')
          PYEOF
          for feed in passwall_packages passwall_luci; do
            grep -q "^CONFIG_FEED_${feed}=m$" .config || { echo "!! CONFIG_FEED_${feed}=m not set"; exit 1; }
            echo "  OK  runtime source ${feed} -> commented (=m)"
          done

          echo "=== required packages (must all be present) ==="
          for p in luci-app-passwall sing-box geoview chinadns-ng \
                   frpc luci-app-frpc firewall4 kmod-nft-socket kmod-nft-tproxy kmod-nft-nat \
                   luci-theme-argon luci-app-argon-config kmod-tcp-bbr \
                   luci-app-autoreboot luci-app-vlmcsd vlmcsd; do
            grep -q "CONFIG_PACKAGE_${p}=y" .config || { echo "!! required package missing: $p"; grep -E "CONFIG_PACKAGE_${p}" .config || true; exit 1; }
            echo "  OK  $p"
          done

          echo "=== unwanted: frpc zh-cn language pack (old/incomplete translation) ==="
          if grep -qE '^CONFIG_PACKAGE_luci-i18n-frpc-zh-cn=y$' .config; then
            echo "!! frpc zh-cn language pack sneaked in (global zh_Hans auto-pull)"; exit 1
          fi
          echo "  OK  no frpc zh-cn language pack"

          echo "=== passwall core selection (must be exactly sing-box + geoview) ==="
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y$' .config || { echo "!! SingBox switch missing"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y$' .config || { echo "!! Geoview switch missing"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y$' .config || { echo "!! nftables proxy switch missing"; exit 1; }
          echo "  OK  sing-box + geoview + nftables proxy"

          echo "=== unwanted packages (must all be absent) ==="
          echo "--- diagnostic: all proxy-core related lines in .config ---"
          grep -iE 'xray|shadowsock|hysteria|naiveproxy|smartdns|haproxy|simple-obfs|v2ray|turboacc|homeproxy|mosdns|frps' .config || true
          # frpc/luci-app-frpc are now REQUIRED (removed from this deny-list).
          # mosdns/luci-app-mosdns + frps added to deny-list (must not sneak back in).
          if grep -qE '^CONFIG_PACKAGE_(luci-app-homeproxy|luci-app-passwall2|luci-app-filetransfer|mosdns|luci-app-mosdns|luci-i18n-mosdns-zh-cn|frps|luci-app-frps|luci-i18n-frpc-zh-cn|luci-app-turboacc|xray-core|xray-plugin|v2ray-plugin|ipv6helper|firewall|smartdns|shadowsocks-rust-sslocal|shadowsocksr-libev-ssr-local|naiveproxy|hysteria|haproxy|simple-obfs-client|shadow-tls)=y' .config; then
            echo "!! an unwanted package sneaked in:"
            grep -E '^CONFIG_PACKAGE_(luci-app-homeproxy|luci-app-passwall2|luci-app-filetransfer|mosdns|luci-app-mosdns|luci-i18n-mosdns-zh-cn|frps|luci-app-frps|luci-i18n-frpc-zh-cn|luci-app-turboacc|xray-core|xray-plugin|v2ray-plugin|ipv6helper|firewall|smartdns|shadowsocks-rust-sslocal|shadowsocksr-libev-ssr-local|naiveproxy|hysteria|haproxy|simple-obfs-client|shadow-tls)=y' .config
            exit 1
          fi
          if grep -qE '^CONFIG_PACKAGE_luci-app-passwall_(Iptables_Transparent_Proxy|INCLUDE_(SmartDNS|Haproxy|Hysteria|NaiveProxy|Shadowsocks_Rust_Client|Shadowsocks_Rust_Server|ShadowsocksR_Libev_Client|ShadowsocksR_Libev_Server|Shadow_TLS|Simple_Obfs|V2ray_Geodata|V2ray_Plugin|Xray|Xray_Plugin))=y' .config; then
            echo "!! an unwanted passwall core switch is on:"
            grep -E '^CONFIG_PACKAGE_luci-app-passwall_(Iptables_Transparent_Proxy|INCLUDE_(SmartDNS|Haproxy|Hysteria|NaiveProxy|Shadowsocks_Rust_Client|Shadowsocks_Rust_Server|ShadowsocksR_Libev_Client|ShadowsocksR_Libev_Server|Shadow_TLS|Simple_Obfs|V2ray_Geodata|V2ray_Plugin|Xray|Xray_Plugin))=y' .config
            exit 1
          fi
          echo "  OK  no unwanted plugins or cores"

          echo "=== FULL selected package list ==="
          grep -E '^CONFIG_PACKAGE_.*=y$' .config | sed 's/^CONFIG_PACKAGE_//; s/=y$//' | sort
          echo "=== total selected packages ==="
          grep -cE '^CONFIG_PACKAGE_.*=y$' .config

      - name: "Inject BBR enable into rootfs (uci-defaults, boot enabled)"
        working-directory: openwrt
        run: |
          # OpenWrt init reads /etc/sysctl.conf (not necessarily /etc/sysctl.d),
          # so append there on first boot and apply immediately - same as the
          # manual enable done on the running router.
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-enable-bbr <<'EOF'
          #!/bin/sh
          grep -q '^net.ipv4.tcp_congestion_control' /etc/sysctl.conf || \
            echo 'net.ipv4.tcp_congestion_control = bbr' >> /etc/sysctl.conf
          grep -q '^net.core.default_qdisc' /etc/sysctl.conf || \
            echo 'net.core.default_qdisc = fq' >> /etc/sysctl.conf
          sysctl -w net.core.default_qdisc=fq >/dev/null 2>&1
          sysctl -w net.ipv4.tcp_congestion_control=bbr >/dev/null 2>&1
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-enable-bbr
          cat files/etc/uci-defaults/99-enable-bbr

      - name: Restore downloads cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: lean612pw-dl-${{ github.run_id }}
          restore-keys: |
            lean612pw-dl-
            lean612full-dl-
            lean612nmbm-dl-
            lean612-dl-
            lean-dl-

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j16
          find dl -size -1kc -delete || true
          make download -j16

      - name: Save downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: lean612pw-dl-${{ github.run_id }}

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/toolchain
          key: lean612pw-toolchain-${{ github.run_id }}
          restore-keys: |
            lean612pw-toolchain-
            lean612full-toolchain-
            lean612nmbm-toolchain-
            lean612-toolchain-

      - name: "Fix mac80211 Werror"
        working-directory: openwrt
        run: |
          python3 - <<'PYEOF'
          p = 'package/kernel/mac80211/Makefile'
          s = open(p).read()
          old = 'EXTRA_CFLAGS="-I$(PKG_BUILD_DIR)/include $(IREMAP_CFLAGS) $(C_DEFINES)"'
          new = 'EXTRA_CFLAGS="-I$(PKG_BUILD_DIR)/include $(IREMAP_CFLAGS) $(C_DEFINES) -Wno-error=incompatible-pointer-types"'
          assert old in s, '!! EXTRA_CFLAGS pattern not found - upstream changed'
          open(p, 'w').write(s.replace(old, new, 1))
          print('patched mac80211 Makefile')
          PYEOF
          grep -n 'Wno-error=incompatible-pointer-types' package/kernel/mac80211/Makefile

      - name: "Fix mac80211 backports for kernel 6.12 (sk_requests_wifi_status redefinition)"
        working-directory: openwrt
        run: |
          # 不再写独立 patch 文件：编译失败后 make 重试会对同一份源码二次应用补丁，
          # Hunk 找不到原文的 <6,16,0>，报 "Hunk #1 FAILED at 23" 直接挂掉。
          # 改为在 Build/Prepare 末尾注入 sed：每次重新解压后都执行，且重复执行无副作用。
          python3 - <<'PYEOF'
          p = 'package/kernel/mac80211/Makefile'
          s = open(p).read()
          anchor = "\techo 'compat-wireless-$(PKG_VERSION)-$(PKG_RELEASE)-$(REVISION)' > $(PKG_BUILD_DIR)/compat_version"
          assert s.count(anchor) == 1, '!! Build/Prepare anchor count=%d - upstream changed' % s.count(anchor)
          sedline = ("\tsed -i 's/LINUX_VERSION_IS_LESS(6,16,0)/LINUX_VERSION_IS_LESS(6,12,0)/' "
                     "$(PKG_BUILD_DIR)/backport-include/net/sock.h\n")
          open(p, 'w').write(s.replace(anchor, sedline + anchor, 1))
          print('injected idempotent sed into mac80211 Build/Prepare')
          PYEOF
          sed -n '375,383p' package/kernel/mac80211/Makefile
          test "$(grep -c 'LINUX_VERSION_IS_LESS(6,12,0)' package/kernel/mac80211/Makefile)" -eq 1
          test "$(find package/kernel/mac80211/patches -name '*wifi-status-for-612*' | wc -l)" -eq 0

      - name: Compile
        working-directory: openwrt
        run: |
          make -j$(nproc) || {
            echo "parallel build failed, retrying once"
            make -j$(nproc) || {
              echo "still failed, capture single-threaded log"
              make -j1 V=s > ../build.log 2>&1 || true
              tail -n 120 ../build.log
              exit 1
            }
          }
          echo "=== final kernel version ==="
          grep -m1 'KERNEL_PATCHVER' target/linux/mediatek/Makefile
          df -h /

      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/toolchain
          key: lean612pw-toolchain-${{ github.run_id }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean612pw-build-log-${{ github.run_number }}
          path: |
            build.log
            openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect output
        run: |
          STAMP=$(date +%Y%m%d-%H%M)
          mkdir -p out
          cp -r openwrt/bin/targets/mediatek/filogic/* out/
          rm -rf out/packages out/sha256sums out/config.buildinfo out/feeds.buildinfo out/manifest out/version.buildinfo
          for f in out/*; do mv "$f" "out/${STAMP}-LEAN612PW-${f##*/}"; done
          ls -lh out/
          test -n "$(find out -maxdepth 1 -type f -print -quit)" || { echo "!! no firmware in out/, abort"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax3000t-lean612pw-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lean-612pw-frpc-build-${{ github.run_number }}
          name: "AX3000T LEDE 正式版(passwall版 内核6.12+大分区+sing-box/geoview/chinadns-ng+frpc0.72.0) lean-612pw-frpc-build-${{ github.run_number }}"
          body: |
            lede (coolsnowwolf/lede) master 滚动最新 + 原生大分区 xiaomi_mi-router-ax3000t。
            内核 pin 6.12；已打 NMBM 双补丁 + mac80211 backports 6.12 修复（同已验证成功版）。

            基于已成功的 passwall 版，按主人 2026-11-27 要求：去 mosdns、加 frpc 0.72.0，其余不变。
            代理：passwall 26.11.23，nftables 透明代理（带 kmod-nft-socket/tproxy/nat）；
            内核只留 sing-box 1.14.4 + geoview 0.2.9 + chinadns-ng（硬依赖），
            其余内核（xray/ss/ssr/hysteria/naiveproxy/smartdns 等）全部不编。
            DNS：不装 mosdns，由 passwall 的 chinadns-ng 自己管（dnsmasq → chinadns-ng）。
            内网穿透：frpc 0.72.0（Lean feed 默认 0.70.1，已 bump）+ luci-app-frpc；
            **不装 frpc 中文语言包**（老版本翻译不全，主人明确不要），界面为英文。
            其它插件：Argon 主题 + BBR(开机自启) + autoreboot + vlmcsd。
            不编：homeproxy / filetransfer / mosdns / turboacc / xray / ipv6helper。
            软件源：编译源头已摘除 3 条 404 坏源（video + passwall_luci + passwall_packages，
            后者两条用 CONFIG_FEED_*=m 生成注释行），出厂 opkg update 全绿。

            刷机后验收命令：
              uname -r                                  → 6.12.x
              df -h /overlay                            → 看剩余空间
              sysctl net.ipv4.tcp_congestion_control    → bbr
              ps w | grep sing-box                      → passwall 未在 LuCI 启用前无进程属正常
              opkg update                               → 全部 Updated、无 404
            DNS 配置提醒：不装 mosdns，转发链只有 dnsmasq → chinadns-ng，比三件套版简单。
          files: out/*
          make_latest: false
          fail_on_unmatched_files: true
