          src-git third_serverchan https://github.com/tty228/luci-app-serverchan.git
          src-git third_alist https://github.com/sbwml/luci-app-alist.git
          src-git third_mosdns https://github.com/sbwml/luci-app-mosdns.git
          src-git third_adguardhome https://github.com/rufengsuixing/luci-app-adguardhome.git
          src-git third_dae https://github.com/QiuSimons/luci-app-dae.git
          src-git third_daed https://github.com/QiuSimons/luci-app-daed.git
          src-git third_vmlinuxbtf https://github.com/QiuSimons/vmlinux-btf.git
          src-git third_iptvhelper https://github.com/riverscn/openwrt-iptvhelper.git
          src-git third_rosy https://github.com/rosywrt/luci-theme-rosy.git
          src-git third_homebox https://github.com/selfcan/luci-app-homebox.git
          src-git third_onliner https://github.com/selfcan/luci-app-onliner.git
          src-git third_advanced https://github.com/sirpdboy/luci-app-advanced.git
          src-git third_chatgpt https://github.com/sirpdboy/luci-app-chatgpt-web.git
          src-git third_cupsd https://github.com/sirpdboy/luci-app-cupsd.git
          src-git third_ddnsgo https://github.com/sirpdboy/luci-app-ddns-go.git
          src-git third_eqosplus https://github.com/sirpdboy/luci-app-eqosplus.git
          src-git third_partexp https://github.com/sirpdboy/luci-app-partexp.git
          src-git third_opentopd https://github.com/sirpdboy/luci-theme-opentopd.git
          src-git third_netspeedtest https://github.com/sirpdboy/netspeedtest.git
          src-git third_tencddns https://github.com/Tencent-Cloud-Plugins/tencentcloud-openwrt-plugin-ddns.git
          src-git third_neobird https://github.com/thinktip/luci-theme-neobird.git
          src-git third_infinity https://github.com/xiaoqingfengATGH/luci-theme-infinityfreedom.git
          src-git third_ua2f https://github.com/Zxilly/UA2F.git
          src-git third_ua2fluci https://github.com/lucikap/luci-app-ua2f.git
          src-git third_design https://github.com/0x676e67/luci-theme-design.git
          src-git third_designcfg https://github.com/0x676e67/luci-app-design-config.git
          src-git third_bandwidthd https://github.com/AlexZhuo/luci-app-bandwidthd.git
          src-git third_mentohust https://github.com/BoringCat/luci-app-mentohust.git
          src-git third_minieap https://github.com/BoringCat/luci-app-minieap.git
          src-git third_minieapcore https://github.com/BoringCat/minieap-openwrt.git
          src-git third_rkpipid https://github.com/CHN-beta/rkp-ipid.git
          src-git third_easytier https://github.com/EasyTier/luci-app-easytier.git
          src-git third_poweroff https://github.com/esirplayground/luci-app-poweroff.git
          src-git third_luclash https://github.com/frainzy1477/luci-app-clash.git
          src-git third_edge https://github.com/garypang13/luci-theme-edge.git
          src-git third_npc https://github.com/ghosthgytop/luci-app-npc.git
          src-git third_msdlite https://github.com/hejiadong0608/luci-app-msd_lite.git
          src-git third_aliddns https://github.com/honwen/luci-app-aliddns.git
          src-git third_ikoolproxy https://github.com/iwrt/luci-app-ikoolproxy.git
          src-git third_aliyundrive https://github.com/jerrykuku/go-aliyundrive-webdav.git
          src-git third_maxminddb https://github.com/jerrykuku/lua-maxminddb.git
          src-git third_aliyundluci https://github.com/jerrykuku/luci-app-go-aliyundrive-webdav.git
          src-git third_dnsfilter https://github.com/kiddin9/luci-app-dnsfilter.git
          src-git third_istore https://github.com/linkease/istore.git
          src-git third_gecoosac https://github.com/lwb1978/openwrt-gecoosac.git
          src-git third_dogcomluci https://github.com/mchome/luci-app-dogcom.git
          src-git third_dogcom https://github.com/mchome/openwrt-dogcom.git
          src-git third_leigod https://github.com/miaoermua/luci-app-leigod-acc.git
          src-git third_vssr https://github.com/MilesPoupart/luci-app-vssr.git
          src-git third_bear https://github.com/NateLol/luci-app-bearDropper.git
          src-git third_athena https://github.com/NONGFAH/luci-app-athena-led.git
          src-git third_atmaterial https://github.com/openwrt-develop/luci-theme-atmaterial.git
          src-git third_macvlan https://github.com/ParticleG/luci-app-macvlan.git
          FEEDS
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 把两批第三方源全部标记 =m + mihomo/frpc 插件显式 =m
          python3 - <<'PYEOF'
          feeds = ['helloworld', 'qmodem'] + \
                  [l.split()[1] for l in open('feeds.conf.default').read().splitlines() if l.startswith('src-git third_')]
          lines = open('.config').read().splitlines()
          for f in feeds:
              key = 'CONFIG_FEED_' + f + '=m'
              hit = False
              for i, ln in enumerate(lines):
                  if ln.startswith('CONFIG_FEED_' + f + '=') or ln == '# CONFIG_FEED_' + f + ' is not set':
                      lines[i] = key; hit = True
              if not hit:
                  lines.append(key)
          # 清掉第三方 feed 包的显式 not-set 行（否则 defconfig 不会把它们标成 m 编进源）
          import os
          tpkgs = set()
          for d in os.listdir('package/feeds'):
              if not d.startswith('third_'):
                  continue
              for sub in os.listdir('package/feeds/' + d):
                  mk = 'package/feeds/%s/%s/Makefile' % (d, sub)
                  if os.path.isfile(mk):
                      for ln in open(mk, errors='ignore'):
                          if ln.startswith('PKG_NAME:='):
                              tpkgs.add(ln.split(':=')[1].strip())
          lines = [ln for ln in lines if not (
              ln.startswith('# CONFIG_PACKAGE_') and ln.endswith(' is not set') and
              ln[17:-11] in tpkgs)]
          for pkg in ('luci-app-mihomo', 'mihomo'):
              key = 'CONFIG_PACKAGE_' + pkg + '=m'
              if not any(ln.startswith('CONFIG_PACKAGE_' + pkg + '=') for ln in lines):
                  lines.append(key)
          open('.config', 'w').write('\n'.join(lines) + '\n')
          print('marked %d feeds as =m; cleared %d third-party not-set lines' % (len(feeds), len(tpkgs)))
          PYEOF
          make defconfig
          # IGNORE_ERRORS=m: 第三方 =m 包编译失败不致命（固件已完成，源里少哪个包不影响其他）
          make -k -j$(nproc) IGNORE_ERRORS=m || true
          echo "=== ipk inventory ==="
          find bin/packages bin/targets -name '*.ipk' 2>/dev/null | wc -l

      - name: "Publish third-party feed (force-push orphan branch 'feed')"
        working-directory: openwrt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/feedpub && mkdir -p /tmp/feedpub
          find bin/packages bin/targets -name '*.ipk' -size -90M -exec cp {} /tmp/feedpub/ \; 2>/dev/null || true
          echo "=== published ipks: $(ls /tmp/feedpub | wc -l) (files >90M excluded to satisfy GitHub 100MB limit) ==="
          cd /tmp/feedpub
          python3 - <<'PYEOF'
          import tarfile, io, gzip, hashlib, os, re
          entries = []
          for fn in sorted(os.listdir('.')):
              if not fn.endswith('.ipk'):
                  continue
              data = open(fn, 'rb').read()
              if data[:8] != b'!<arch>\n':
                  continue
              pos, control = 8, None
              while pos < len(data):
                  hdr = data[pos:pos+60]
                  try:
                      name = hdr[:16].decode().strip().rstrip('/')
                      size = int(hdr[48:58].decode().strip())
                  except Exception:
                      break
                  blob = data[pos+60:pos+60+size]
                  pos += 60 + size
                  if pos % 2: pos += 1
                  if name in ('control.tar.gz', 'control.tar.zst'):
                      try:
                          tar = tarfile.open(fileobj=io.BytesIO(blob), mode='r:*')
                          mem = [m for m in tar.getmembers() if os.path.basename(m.name) == 'control'][0]
                          control = tar.extractfile(mem).read().decode(errors='replace')
                      except Exception as e:
                          print('skip', fn, str(e)[:60])
                          control = None
                      break
              if not control:
                  continue
              fields = dict(l.split(': ', 1) for l in control.splitlines() if ': ' in l)
              pkg = fields.get('Package'); ver = fields.get('Version'); arch = fields.get('Architecture')
              if not pkg:
                  continue
              dep = fields.get('Depends')
              e = 'Package: %s\nVersion: %s\n' % (pkg, ver)
              if dep: e += 'Depends: %s\n' % dep
              e += 'Architecture: %s\nSize: %d\nSHA256sum: %s\nFilename: %s\n\n' % (
                  arch, len(data), hashlib.sha256(data).hexdigest(), fn)
              entries.append(e)
          idx = ''.join(entries)
          open('Packages', 'w').write(idx)
          with gzip.open('Packages.gz', 'wb') as f:
              f.write(idx.encode())
          print('index entries:', len(entries))
          PYEOF
          git init -q
          git config user.email "feed-bot@ax3000t.local" && git config user.name "feed-bot"
          git add -fA .
          git commit -qm "third-party opkg feed build-${{ github.run_number }} ($(ls *.ipk | wc -l) ipks)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/huang770101/ax3000t-builder-public.git" HEAD:refs/heads/feed
          echo "feed published: https://raw.githubusercontent.com/huang770101/ax3000t-builder-public/feed/"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean612pw-build-log-${{ github.run_number }}
          path: |
            build.log
            openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect output
        run: |
          STAMP=$(date +%Y%m%d-%H%M)
          mkdir -p out
          cp -r openwrt/bin/targets/mediatek/filogic/* out/
          rm -rf out/packages out/sha256sums out/config.buildinfo out/feeds.buildinfo out/manifest out/version.buildinfo
          for f in out/*; do mv "$f" "out/${STAMP}-LEAN612PW-${f##*/}"; done
          ls -lh out/
          test -n "$(find out -maxdepth 1 -type f -print -quit)" || { echo "!! no firmware in out/, abort"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax3000t-lean612pw-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
