name: Build LEDE AX3000T 最终版 (kernel 6.12 / passwall + Argon + BBR + autoreboot + ttyd + zram)

# 基于 build-lean-612pw.yml（已 5 次编译成功的验证管线）精简。
# 主人 2026-11-27 指定「最终版」，2026-11-28 追加固态：
#   插件：passwall / Argon / BBR(必须开机自启) / 定时重启 / ttyd(网页终端) + zram(受控省内存)。
#   Argon 出厂默认内建壁纸：zz-argon-wallpaper 首启把 online_wallpaper 覆盖成 none。
#   LAN 默认 192.168.31.1；root 密码 + WiFi(ESSID Xiaomi_14D3) 编译内置，
#     密码值走 Actions secrets（ROOT_PASSWORD / WIFI_PASSWORD），不进仓库文本。
#   opkg 源出厂即为主人指定的固定清单：
#     distfeeds.conf = 腾讯镜像 lede releases/24.10.5 五条
#     customfeeds.conf = 仅 dllkids 一条
# 内核只留 sing-box / geoview / chinadns-ng；feed 加 passwall_packages + passwall_luci。
# 无 Phase B、无第三方源发布（纯净版）。
# tag = lean-final-build-N。

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  DEVICE: xiaomi_mi-router-ax3000t
  KERNEL_VER: "6.12"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/hostedtoolcache/go \
            /usr/local/go /usr/local/share/powershell
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc gettext git \
            libncurses-dev libssl-dev libelf-dev make python3 python-is-python3 rsync unzip \
            zlib1g-dev file swig wget curl zstd

      - name: Clone source (lede master, rolling - no commit pin)
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "=== source identity ==="
          git log -1 --format="commit: %h %ad %s" --date=short

      - name: "Pin kernel ${KERNEL_VER}"
        working-directory: openwrt
        run: |
          python3 - <<'PYEOF'
          import os
          ver = os.environ['KERNEL_VER']
          p = 'target/linux/mediatek/Makefile'
          s = open(p).read()
          old = 'KERNEL_PATCHVER:=6.18'
          new = 'KERNEL_PATCHVER:=' + ver
          assert old in s, '!! KERNEL_PATCHVER:=6.18 not found - upstream Makefile changed, patch needs review'
          open(p, 'w').write(s.replace(old, new, 1))
          print('pinned mediatek KERNEL_PATCHVER 6.18 ->', ver)
          PYEOF
          grep -n 'KERNEL_PATCHVER\|KERNEL_TESTING_PATCHVER' target/linux/mediatek/Makefile
          test -d target/linux/mediatek/patches-6.12 && echo "  OK patches-6.12"
          test -d target/linux/mediatek/files-6.12 && echo "  OK files-6.12"

      - name: "PATCH 1/2 - kernel mtk_bmt.c: support bmt-mtd-overridden-oobsize"
        working-directory: openwrt
        run: |
          python3 - <<'PYEOF'
          p = 'target/linux/generic/files/drivers/mtd/nand/mtk_bmt.c'
          s = open(p).read()
          anchor1 = 'int mtk_bmt_attach(struct mtd_info *mtd)\n{\n\tstruct device_node *np;\n\tint ret = 0;\n'
          repl1   = 'int mtk_bmt_attach(struct mtd_info *mtd)\n{\n\tstruct device_node *np;\n\tint ret = 0;\n\tu32 overridden_oobsize = 0;\n'
          assert s.count(anchor1) == 1, '!! anchor1 count != 1 (%d)' % s.count(anchor1)
          s = s.replace(anchor1, repl1, 1)
          anchor2 = '\tbmtd.mtd = mtd;\n\tmtk_bmt_replace_ops(mtd);\n\n\tbmtd.blk_size = mtd->erasesize;'
          repl2 = ('\tbmtd.mtd = mtd;\n\tmtk_bmt_replace_ops(mtd);\n\n'
                   '\tif (!of_property_read_u32(np, "mediatek,bmt-mtd-overridden-oobsize",\n'
                   '\t\t\t\t\t  &overridden_oobsize))\n'
                   '\t\tif (overridden_oobsize < bmtd.mtd->oobsize) {\n'
                   '\t\t\tbmtd.mtd->oobsize = overridden_oobsize;\n'
                   '\t\t\tpr_info("NMBM: mtd OOB size has been overridden to %luB\\n",\n'
                   '\t\t\t\t(long unsigned int)bmtd.mtd->oobsize);\n'
                   '\t\t}\n\n'
                   '\tbmtd.blk_size = mtd->erasesize;')
          assert s.count(anchor2) == 1, '!! anchor2 count != 1 (%d)' % s.count(anchor2)
          s = s.replace(anchor2, repl2, 1)
          open(p, 'w').write(s)
          print('PATCH1 applied')
          PYEOF
          grep -n 'overridden_oobsize\|bmt-mtd-overridden-oobsize' target/linux/generic/files/drivers/mtd/nand/mtk_bmt.c

      - name: "PATCH 2/2 - DTS: add mediatek,bmt-mtd-overridden-oobsize = <64>"
        working-directory: openwrt
        run: |
          python3 - <<'PYEOF'
          p = 'target/linux/mediatek/dts/mt7981b-xiaomi_mi-router.dtsi'
          s = open(p).read()
          anchor = '\t\tmediatek,nmbm;\n\t\tmediatek,bmt-max-ratio = <1>;\n\t\tmediatek,bmt-max-reserved-blocks = <64>;\n'
          repl   = anchor + '\t\tmediatek,bmt-mtd-overridden-oobsize = <64>;\n'
          assert s.count(anchor) == 1, '!! DTS anchor count != 1 (%d)' % s.count(anchor)
          assert 'bmt-mtd-overridden-oobsize' not in s, '!! already patched'
          open(p, 'w').write(s.replace(anchor, repl, 1))
          print('PATCH2 applied')
          PYEOF
          grep -n -A4 'mediatek,nmbm' target/linux/mediatek/dts/mt7981b-xiaomi_mi-router.dtsi

      - name: "Assert both NMBM fixes present before make"
        working-directory: openwrt
        run: |
          grep -q 'bmt-mtd-overridden-oobsize' target/linux/generic/files/drivers/mtd/nand/mtk_bmt.c || { echo "!! PATCH1 missing"; exit 1; }
          grep -q 'mediatek,bmt-mtd-overridden-oobsize = <64>' target/linux/mediatek/dts/mt7981b-xiaomi_mi-router.dtsi || { echo "!! PATCH2 missing"; exit 1; }
          echo "OK both NMBM fixes present"

      - name: "Init feeds (add passwall x2, DROP helloworld+video)"
        working-directory: openwrt
        run: |
          # passwall official feeds (author README: main + core packages)
          sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default
          sed -i '2i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' feeds.conf.default
          # helloworld DROPPED entirely: ssr-plus choice-block force-selects xray-core (主人明确不要).
          # video feed = the 7th software source (openwrt_video) that 404s on update -> drop.
          # NOTE: passwall feeds stay ACTIVE here (needed to compile the packages); their opkg
          # *runtime* sources are suppressed later via CONFIG_FEED_*=m (see strict gate step).
          sed -i '/src-git helloworld/s/^/#/' feeds.conf.default
          sed -i '/src-git video/s/^/#/' feeds.conf.default
          echo "=== active feeds ==="
          grep '^src-git' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # passwall marks many proxy cores "default y if aarch64"
          # (Xray / SSR / SimpleObfs / V2rayPlugin / Haproxy / SmartDNS...).
          # make defconfig turns them on even with "is not set" in the seed config.
          # Force ALL passwall optional cores to default n; we opt in ONLY
          # SingBox + Geoview + Nftables proxy explicitly in the config.
          PW_MK="feeds/passwall_luci/luci-app-passwall/Makefile"
          test -f "$PW_MK" || { echo "!! passwall Makefile missing at $PW_MK"; find feeds -path '*luci-app-passwall/Makefile' 2>/dev/null; exit 1; }
          sed -i -E 's/^([[:space:]]*)default y([[:space:]]+if .*)?$/\1default n/' "$PW_MK"
          echo "=== passwall optional core defaults (all should be default n) ==="
          grep -nE '^[[:space:]]*(config PACKAGE_|default [yn])' "$PW_MK" | head -60

          # sanity: needed packages must be available from the kept feeds
          for p in chinadns-ng geoview sing-box; do
            test -f "package/feeds/packages/$p/Makefile" || test -f "package/feeds/passwall_packages/$p/Makefile" || {
              echo "!! $p package missing from enabled feeds"; exit 1; }
            echo "  OK $p available"
          done
          for p in luci-theme-argon luci-app-argon-config luci-app-autoreboot luci-app-ttyd; do
            test -f "package/feeds/luci/$p/Makefile" || test -f "package/feeds/packages/$p/Makefile" || {
              echo "!! $p missing"; exit 1; }
            echo "  OK $p available"
          done
          # ttyd 二进制在 packages feed（luci-app-ttyd 依赖它，需确认 Makefile 在）
          test -f package/feeds/packages/ttyd/Makefile || {
            echo "!! ttyd binary Makefile missing"; exit 1; }
          echo "  OK ttyd binary available"
          # zram-swap 是 base system 包，定义在 package/system/zram-swap（不在 feeds 里）
          # kmod-zram 是内核核心包，定义在 package/kernel/linux/modules/other.mk
          test -f package/system/zram-swap/Makefile || { echo "!! zram-swap Makefile missing"; exit 1; }
          grep -q 'define KernelPackage/zram' package/kernel/linux/modules/other.mk || {
            echo "!! kmod-zram definition missing"; exit 1; }
          echo "  OK zram-swap + kmod-zram available"
          # kmod-tcp-bbr 是内核核心包，定义在 package/kernel/linux/modules/netsupport.mk
          # （无独立 Makefile 目录，不能进 feeds 可用性检查循环）
          grep -q 'tcp-bbr' package/kernel/linux/modules/netsupport.mk || {
            echo "!! kmod-tcp-bbr definition missing from netsupport.mk"; exit 1; }
          echo "  OK kmod-tcp-bbr (kernel core pkg) available"

      - name: "Load config (final: passwall+argon+bbr+autoreboot) + strict gate"
        working-directory: openwrt
        run: |
          cp ../config/ax3000t-lean-final.config .config
          make defconfig
          grep -q "DEVICE_${DEVICE}=y" .config || { echo "!! device not selected"; exit 1; }

          # --- Force passwall opkg runtime feeds to commented form (=m) AFTER defconfig.
          # Some OpenWrt versions normalize CONFIG_FEED_* in defconfig; re-assert here.
          # =m makes FeedSourcesAppendOPKG emit "# src/gz ..." (commented, no 404 on update).
          # Does NOT affect compilation (packages are compiled in via CONFIG_PACKAGE_*=y).
          python3 - <<'PYEOF'
          p = '.config'
          lines = open(p).read().splitlines()
          for feed in ('passwall_packages', 'passwall_luci'):
              key = 'CONFIG_FEED_' + feed + '='
              found = False
              for i, ln in enumerate(lines):
                  if ln.startswith(key) or ln == '# ' + key.rstrip('=') + ' is not set':
                      lines[i] = key + 'm'
                      found = True
              if not found:
                  lines.append(key + 'm')
              print('force', key + 'm', 'was_found=' + str(found))
          open(p, 'w').write('\n'.join(lines) + '\n')
          PYEOF
          for feed in passwall_packages passwall_luci; do
            grep -q "^CONFIG_FEED_${feed}=m$" .config || { echo "!! CONFIG_FEED_${feed}=m not set"; exit 1; }
            echo "  OK  runtime source ${feed} -> commented (=m)"
          done

          echo "=== required packages (must all be present) ==="
          for p in luci-app-passwall sing-box geoview chinadns-ng \
                   firewall4 kmod-nft-socket kmod-nft-tproxy kmod-nft-nat \
                   luci-theme-argon luci-app-argon-config kmod-tcp-bbr \
                   luci-app-autoreboot; do
            grep -q "CONFIG_PACKAGE_${p}=y" .config || { echo "!! required package missing: $p"; grep -E "CONFIG_PACKAGE_${p}" .config || true; exit 1; }
            echo "  OK  $p"
          done

          echo "=== passwall core selection (must be exactly sing-box + geoview) ==="
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y$' .config || { echo "!! SingBox switch missing"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y$' .config || { echo "!! Geoview switch missing"; exit 1; }
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y$' .config || { echo "!! nftables proxy switch missing"; exit 1; }
          echo "  OK  sing-box + geoview + nftables proxy"

          echo "=== unwanted packages (must all be absent) ==="
          echo "--- diagnostic: proxy-core related lines in .config ---"
          grep -iE 'xray|shadowsock|hysteria|naiveproxy|smartdns|haproxy|simple-obfs|v2ray|turboacc|homeproxy|mosdns|frp|vlmcsd' .config || true
          # 最终版纯净闸门：上一版插件一个都不许回来，frpc/ddns/upnp/arpbind/eqos/mwan3 全禁；ttyd 已按主人 2026-11-28 指定放行。
          if grep -qE '^CONFIG_PACKAGE_(luci-app-homeproxy|luci-app-passwall2|luci-app-filetransfer|mosdns|luci-app-mosdns|luci-i18n-mosdns-zh-cn|frps|luci-app-frps|luci-app-vlmcsd|vlmcsd|luci-app-turboacc|xray-core|xray-plugin|v2ray-plugin|ipv6helper|firewall|smartdns|shadowsocks-rust-sslocal|shadowsocksr-libev-ssr-local|naiveproxy|hysteria|haproxy|simple-obfs-client|shadow-tls|luci-app-oaf|kmod-oaf|appfilter|luci-app-openclash|luci-app-mihomo|luci-app-clash|luci-app-vssr|luci-app-ssr-plus|luci-app-alist|luci-app-adguardhome|luci-app-serverchan|luci-app-ddns-go|luci-app-istore|luci-app-easytier|luci-app-dae|luci-app-daed|luci-app-frpc|luci-i18n-frpc-zh-cn|luci-app-ddnsto|ddnsto|luci-app-ddns|ddns-scripts|luci-app-upnp|miniupnpd-nftables|luci-app-arpbind|luci-app-eqos|luci-app-mwan3|mwan3|frpc)=y' .config; then
            echo "!! an unwanted package sneaked in:"
            grep -E '^CONFIG_PACKAGE_(luci-app-homeproxy|luci-app-passwall2|luci-app-filetransfer|mosdns|luci-app-mosdns|luci-i18n-mosdns-zh-cn|frps|luci-app-frps|luci-app-vlmcsd|vlmcsd|luci-app-turboacc|xray-core|xray-plugin|v2ray-plugin|ipv6helper|firewall|smartdns|shadowsocks-rust-sslocal|shadowsocksr-libev-ssr-local|naiveproxy|hysteria|haproxy|simple-obfs-client|shadow-tls|luci-app-oaf|kmod-oaf|appfilter|luci-app-openclash|luci-app-mihomo|luci-app-clash|luci-app-vssr|luci-app-ssr-plus|luci-app-alist|luci-app-adguardhome|luci-app-serverchan|luci-app-ddns-go|luci-app-istore|luci-app-easytier|luci-app-dae|luci-app-daed|luci-app-frpc|luci-i18n-frpc-zh-cn|luci-app-ddnsto|ddnsto|luci-app-ddns|ddns-scripts|luci-app-upnp|miniupnpd-nftables|luci-app-arpbind|luci-app-eqos|luci-app-mwan3|mwan3|frpc)=y' .config
            exit 1
          fi
          if grep -qE '^CONFIG_PACKAGE_luci-app-passwall_(Iptables_Transparent_Proxy|INCLUDE_(SmartDNS|Haproxy|Hysteria|NaiveProxy|Shadowsocks_Rust_Client|Shadowsocks_Rust_Server|ShadowsocksR_Libev_Client|ShadowsocksR_Libev_Server|Shadow_TLS|Simple_Obfs|V2ray_Geodata|V2ray_Plugin|Xray|Xray_Plugin))=y' .config; then
            echo "!! an unwanted passwall core switch is on:"
            grep -E '^CONFIG_PACKAGE_luci-app-passwall_(Iptables_Transparent_Proxy|INCLUDE_(SmartDNS|Haproxy|Hysteria|NaiveProxy|Shadowsocks_Rust_Client|Shadowsocks_Rust_Server|ShadowsocksR_Libev_Client|ShadowsocksR_Libev_Server|Shadow_TLS|Simple_Obfs|V2ray_Geodata|V2ray_Plugin|Xray|Xray_Plugin))=y' .config
            exit 1
          fi
          echo "  OK  no unwanted plugins or cores"

          echo "=== FULL selected package list ==="
          grep -E '^CONFIG_PACKAGE_.*=y$' .config | sed 's/^CONFIG_PACKAGE_//; s/=y$//' | sort
          echo "=== total selected packages ==="
          grep -cE '^CONFIG_PACKAGE_.*=y$' .config

      - name: "Inject BBR boot enable + LAN IP + root password + WiFi + opkg feeds"
        working-directory: openwrt
        env:
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        run: |
          # ROOT CAUSE of "BBR never active at boot" in all prior builds:
          #   The old uci-defaults script runs ONCE on first boot, and does NOT
          #   modprobe tcp_bbr first. Writing sysctl net.ipv4.tcp_congestion_control=bbr
          #   before the bbr algorithm is registered in the kernel silently fails
          #   -> falls back to cubic. sysctl.conf is also read too early (START=11).
          # FIX (identical to the manual fix verified on the running router 2026-11-26):
          #   ship a procd init script with START=98 (runs late, after kmods load),
          #   which modprobe's tcp_bbr THEN sets fq + bbr. Enabled at build time so
          #   /etc/rc.d/S98bbr-enable exists -> runs on EVERY boot, no manual patch.
          # 凭据纪律：密码值来自 Actions secrets，只在 runner 内存中出现，
          # 写进固件内一次性 uci-defaults 脚本（首启执行后自动删除），绝不进仓库文本。
          test -n "$ROOT_PASSWORD" || { echo "!! secret ROOT_PASSWORD is empty - set it in repo settings"; exit 1; }
          test -n "$WIFI_PASSWORD" || { echo "!! secret WIFI_PASSWORD is empty - set it in repo settings"; exit 1; }
          mkdir -p files/etc/init.d
          cat > files/etc/init.d/bbr-enable <<'EOF'
          #!/bin/sh /etc/rc.common
          # Enable BBR at boot, after kmod-tcp-bbr is loadable. START=98 is late
          # enough (sysctl.conf default START=11 is too early -> cubic fallback).
          START=98

          start() {
              modprobe tcp_bbr 2>/dev/null
              sysctl -w net.core.default_qdisc=fq >/dev/null 2>&1
              sysctl -w net.ipv4.tcp_congestion_control=bbr >/dev/null 2>&1
              logger -t bbr-enable "applied: $(cat /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null)"
          }
          EOF
          chmod +x files/etc/init.d/bbr-enable
          # Belt-and-suspenders enable:
          #  1) pre-create S98 symlink now (in case files/ copy preserves symlinks).
          #  2) uci-defaults calls `/etc/init.d/bbr-enable enable` on first boot to
          #     recreate it if the symlink did not survive the rootfs copy.
          # Once S98bbr-enable exists it runs on EVERY boot via procd.
          mkdir -p files/etc/rc.d files/etc/uci-defaults
          ln -sf ../init.d/bbr-enable files/etc/rc.d/S98bbr-enable
          cat > files/etc/uci-defaults/99-enable-bbr <<'EOF'
          #!/bin/sh
          # Only registers the init script (does NOT set sysctl here - too early).
          # The actual modprobe+sysctl happens in S98bbr-enable on every boot.
          /etc/init.d/bbr-enable enable >/dev/null 2>&1
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-enable-bbr

          # --- Default LAN IP 192.168.31.1 (主人指定).
          # Avoids conflict with the modem's management subnet on the
          # 192.168.1.x default; runs once on first boot via uci-defaults.
          cat > files/etc/uci-defaults/99-lan-ip <<'EOF'
          #!/bin/sh
          uci -q set network.lan.ipaddr='192.168.31.1'
          uci -q commit network
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-lan-ip

          # --- root 密码编译内置（主人 2026-11-27 指定）。
          # uci-defaults 首启执行 passwd 后该脚本被自动删除，明文不落盘。
          cat > files/etc/uci-defaults/99-root-pass <<EOF
          #!/bin/sh
          printf '%s\n%s\n' '${ROOT_PASSWORD}' '${ROOT_PASSWORD}' | passwd root
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-root-pass

          # --- WiFi 编译内置（主人 2026-11-27 指定）：ESSID Xiaomi_14D3，双频同名，WPA2。
          # config_generate 先生成 radio0/radio1（默认 disabled=1），uci-defaults 在其后执行，
          # 这里放开 disabled 并统一 SSID/密钥；壁纸由 zz-argon-wallpaper 单独处理。
          cat > files/etc/uci-defaults/99-wifi-setup <<EOF
          #!/bin/sh
          for r in radio0 radio1; do
              uci -q set wireless.\$r.disabled='0'
              uci -q set wireless.default_\$r.ssid='Xiaomi_14D3'
              uci -q set wireless.default_\$r.encryption='psk2'
              uci -q set wireless.default_\$r.key='${WIFI_PASSWORD}'
              uci -q delete wireless.default_\$r.hidden 2>/dev/null
          done
          uci -q commit wireless
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-wifi-setup

          # --- Argon 出厂默认内建壁纸（主人 2026-11-28 指定）。
          # 根因：luci-app-argon-config 包自带 /etc/config/argon，写死 online_wallpaper='bing'，
          # 主题模板 sysauth.ut 见非 none 就拉在线必应图，内置 bg1.jpg 被盖住。
          # 这里用 zz- 前缀（字典序在包自带的 luci-argon-config 之后）首启覆盖成 none，
          # 主题即回落 /www/luci-static/argon/img/bg1.jpg（已随 luci-theme-argon 编入固件）。
          cat > files/etc/uci-defaults/zz-argon-wallpaper <<'EOF'
          #!/bin/sh
          uci -q set argon.@global[0].online_wallpaper='none'
          uci -q commit argon
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/zz-argon-wallpaper

          # --- zram 受控启动脚本（主人 2026-11-28 指定：省内存但不能撑爆 CPU）。
          # 覆盖 zram-swap 包自带的 /etc/init.d/zram（files 层优先级高于包文件），
          # 三道 CPU 保护：① 算法 lz4（最快）② 池子只开 96MB（约 40% 内存，不是全量 232MB）
          # ③ sysctl swappiness=15（内存真紧张才换出，避免无谓压缩）。
          # 原脚本默认算法 lzo、池子=全部 MemTotal，CPU 与内存占用都不可控，故替换。
          cat > files/etc/init.d/zram <<'EOF'
          #!/bin/sh /etc/rc.common
          # 受控 zram：省内存 + 锁死 CPU 开销（主人 2026-11-28 指定）
          START=15
          ZRAM_DEV=/dev/zram0
          ZRAM_SIZE_MB=96

          start() {
              [ -e /proc/swaps ] || { logger -t zram "kernel has no swap support"; return 1; }
              grep -q zram /proc/swaps && { logger -t zram "zram swap already on"; return 0; }
              [ -e "$ZRAM_DEV" ] || { logger -t zram "zram device missing"; return 1; }

              # 算法：lz4 最快、最省 CPU（内核默认压缩器已设为 lz4）
              local algo="lz4"
              grep -qw "$algo" /sys/block/zram0/comp_algorithm 2>/dev/null && \
                  echo "$algo" > /sys/block/zram0/comp_algorithm
              uci -q set system.@system[0].zram_comp_algo="$algo"
              uci -q commit system

              # 池子限 96MB，避免全量内存开 zram 带来的额外占用
              echo $(( ZRAM_SIZE_MB * 1024 * 1024 )) > /sys/block/zram0/disksize
              mkswap "$ZRAM_DEV" >/dev/null 2>&1
              swapon -p 100 "$ZRAM_DEV" >/dev/null 2>&1

              # 换出门槛压低：内存紧张才压缩，平时不耗 CPU
              sysctl -w vm.swappiness=15 >/dev/null 2>&1
              logger -t zram "started: ${ZRAM_SIZE_MB}MB lz4 swap, swappiness=15"
          }

          stop() {
              swapoff "$ZRAM_DEV" >/dev/null 2>&1
              echo 1 > /sys/block/zram0/reset 2>/dev/null
          }

          status() {
              [ -e /proc/swaps ] && grep zram /proc/swaps
              [ -r /sys/block/zram0/mm_stat ] && cat /sys/block/zram0/mm_stat
          }
          EOF
          chmod +x files/etc/init.d/zram
          mkdir -p files/etc/rc.d
          ln -sf ../init.d/zram files/etc/rc.d/S15zram

          # --- opkg 源出厂即为主人指定清单（静态文件，非 uci-defaults）。
          # distfeeds.conf = 腾讯镜像 lede releases/24.10.5 五条；customfeeds.conf = 仅 dllkids。
          mkdir -p files/etc/opkg
          cat > files/etc/opkg/distfeeds.conf <<'EOF'
          src/gz openwrt_core https://mirrors.tencent.com/lede/releases/24.10.5/targets/mediatek/filogic/packages
          src/gz openwrt_base https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_cortex-a53/base
          src/gz openwrt_luci https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_cortex-a53/luci
          src/gz openwrt_packages https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_cortex-a53/packages
          src/gz openwrt_routing https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_cortex-a53/routing
          src/gz openwrt_telephony https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_cortex-a53/telephony
          EOF
          cat > files/etc/opkg/customfeeds.conf <<'EOF'
          src/gz dllkids https://dl.openwrt.ai/packages-25.12/aarch64_cortex-a53/kiddin9/
          EOF

          echo "=== bbr-enable init script ==="
          cat files/etc/init.d/bbr-enable
          echo "=== rc.d symlink ==="
          ls -l files/etc/rc.d/S98bbr-enable
          echo "=== uci-defaults fallback ==="
          cat files/etc/uci-defaults/99-enable-bbr
          echo "=== lan-ip uci-defaults ==="
          cat files/etc/uci-defaults/99-lan-ip
          echo "=== root-pass uci-defaults (value masked check) ==="
          head -1 files/etc/uci-defaults/99-root-pass && wc -l files/etc/uci-defaults/99-root-pass
          echo "=== wifi-setup uci-defaults (key line masked) ==="
          grep -v "^.*key=" files/etc/uci-defaults/99-wifi-setup
          grep -c "key=" files/etc/uci-defaults/99-wifi-setup
          echo "=== zz-argon-wallpaper uci-defaults ==="
          cat files/etc/uci-defaults/zz-argon-wallpaper
          echo "=== zram controlled init (cpu-safe) ==="
          grep -E 'START=|ZRAM_SIZE_MB|comp_algorithm|swappiness|swapon' files/etc/init.d/zram
          echo "=== distfeeds.conf ==="
          cat files/etc/opkg/distfeeds.conf
          echo "=== customfeeds.conf ==="
          cat files/etc/opkg/customfeeds.conf

      - name: Restore downloads cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: leandl-${{ github.run_id }}
          restore-keys: |
            lean612pw-dl-
            lean612full-dl-
            lean612nmbm-dl-
            lean612-dl-
            lean-dl-

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j16
          find dl -size -1kc -delete || true
          make download -j16

      - name: Save downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: leandl-${{ github.run_id }}

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/toolchain
          key: leantc-${{ github.run_id }}
          restore-keys: |
            lean612pw-toolchain-
            lean612full-toolchain-
            lean612nmbm-toolchain-
            lean612-toolchain-

      - name: "Fix mac80211 Werror"
        working-directory: openwrt
        run: |
          python3 - <<'PYEOF'
          p = 'package/kernel/mac80211/Makefile'
          s = open(p).read()
          old = 'EXTRA_CFLAGS="-I$(PKG_BUILD_DIR)/include $(IREMAP_CFLAGS) $(C_DEFINES)"'
          new = 'EXTRA_CFLAGS="-I$(PKG_BUILD_DIR)/include $(IREMAP_CFLAGS) $(C_DEFINES) -Wno-error=incompatible-pointer-types"'
          assert old in s, '!! EXTRA_CFLAGS pattern not found - upstream changed'
          open(p, 'w').write(s.replace(old, new, 1))
          print('patched mac80211 Makefile')
          PYEOF
          grep -n 'Wno-error=incompatible-pointer-types' package/kernel/mac80211/Makefile

      - name: "Fix mac80211 backports for kernel 6.12 (sk_requests_wifi_status redefinition)"
        working-directory: openwrt
        run: |
          # 不再写独立 patch 文件：编译失败后 make 重试会对同一份源码二次应用补丁，
          # Hunk 找不到原文的 <6,16,0>，报 "Hunk #1 FAILED at 23" 直接挂掉。
          # 改为在 Build/Prepare 末尾注入 sed：每次重新解压后都执行，且重复执行无副作用。
          python3 - <<'PYEOF'
          p = 'package/kernel/mac80211/Makefile'
          s = open(p).read()
          anchor = "\techo 'compat-wireless-$(PKG_VERSION)-$(PKG_RELEASE)-$(REVISION)' > $(PKG_BUILD_DIR)/compat_version"
          assert s.count(anchor) == 1, '!! Build/Prepare anchor count=%d - upstream changed' % s.count(anchor)
          sedline = ("\tsed -i 's/LINUX_VERSION_IS_LESS(6,16,0)/LINUX_VERSION_IS_LESS(6,12,0)/' "
                     "$(PKG_BUILD_DIR)/backport-include/net/sock.h\n")
          open(p, 'w').write(s.replace(anchor, sedline + anchor, 1))
          print('injected idempotent sed into mac80211 Build/Prepare')
          PYEOF
          sed -n '375,383p' package/kernel/mac80211/Makefile
          test "$(grep -c 'LINUX_VERSION_IS_LESS(6,12,0)' package/kernel/mac80211/Makefile)" -eq 1
          test "$(find package/kernel/mac80211/patches -name '*wifi-status-for-612*' | wc -l)" -eq 0

      - name: Compile
        working-directory: openwrt
        run: |
          make -j$(nproc) || {
            echo "parallel build failed, retrying once"
            make -j$(nproc) || {
              echo "still failed, capture single-threaded log"
              make -j1 V=s > ../build.log 2>&1 || true
              tail -n 120 ../build.log
              exit 1
            }
          }
          echo "=== final kernel version ==="
          grep -m1 'KERNEL_PATCHVER' target/linux/mediatek/Makefile
          df -h /

      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/toolchain
          key: leantc-${{ github.run_id }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: leanfinal-build-log-${{ github.run_number }}
          path: |
            build.log
            openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect output
        run: |
          STAMP=$(date +%Y%m%d-%H%M)
          # Release 标题用北京时间编译当天（runner 默认是 UTC，会差一天）
          echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"
          mkdir -p out
          cp -r openwrt/bin/targets/mediatek/filogic/* out/
          rm -rf out/packages out/sha256sums out/config.buildinfo out/feeds.buildinfo out/manifest out/version.buildinfo
          for f in out/*; do mv "$f" "out/${STAMP}-FINAL-${f##*/}"; done
          ls -lh out/
          test -n "$(find out -maxdepth 1 -type f -print -quit)" || { echo "!! no firmware in out/, abort"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax3000t-leanfinal-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lean-final-build-${{ github.run_number }}
          name: "AX3000T - lede固件 - ${{ env.BUILD_DATE }}"
          body: |
            固件插件说明：
            - PassWall          （luci-app-passwall）
            - Argon             （luci-app-argon-config）
            - BBR               （kmod-tcp-bbr）
            - 定时重启          （luci-app-autoreboot）
            - ttyd              （luci-app-ttyd）
            - zram              （zram-swap）
          files: out/*
          make_latest: false
          fail_on_unmatched_files: true
