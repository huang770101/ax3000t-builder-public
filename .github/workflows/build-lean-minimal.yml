name: Build LEDE AX3000T (Lean source / native big-partition / MINIMAL no plugins)

# Lean (coolsnowwolf/lede) master 源码 + 原生大分区设备 xiaomi_mi-router-ax3000t。
# 纯净版：只保留 LuCI 基础界面 + 中文，零插件。
# 目的：验证"去掉全部插件后能否正常启动"。
# 产出 sysupgrade.bin，Release tag = lean-min-build-N（独立，不污染 lean-build-N）。

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  DEVICE: xiaomi_mi-router-ax3000t

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/hostedtoolcache/go \
            /usr/local/go /usr/local/share/powershell
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc gettext git \
            libncurses-dev libssl-dev libelf-dev make python3 python-is-python3 rsync unzip \
            zlib1g-dev file swig wget curl

      - name: Clone source (Lean lede master)
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "=== source identity ==="
          git log -1 --format="commit: %h %ad %s" --date=short

      - name: "Init feeds (packages/luci/routing/telephony/video; helloworld removed)"
        working-directory: openwrt
        run: |
          sed -i '/helloworld/s/^/#/' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config (MINIMAL - no plugins)
        working-directory: openwrt
        run: |
          cp ../config/ax3000t-lean-minimal.config .config
          make defconfig
          grep -q "DEVICE_${DEVICE}=y" .config || { echo "!! device not selected"; exit 1; }

          echo "=== required base (must be present) ==="
          for p in luci; do
            grep -q "CONFIG_PACKAGE_${p}=y" .config || { echo "!! required package missing: $p"; exit 1; }
            echo "  OK  $p"
          done

          echo ""
          echo "=== FULL selected package list (purity audit) ==="
          grep -E '^CONFIG_PACKAGE_.*=y$' .config | sed 's/^CONFIG_PACKAGE_//; s/=y$//' | sort
          echo ""
          echo "=== total selected packages ==="
          grep -cE '^CONFIG_PACKAGE_.*=y$' .config

          echo "=== unwanted plugins (must all be absent; kmod-tcp-bbr is a tiny kernel module allowed) ==="
          if grep -qE "^CONFIG_PACKAGE_(luci-app-(homeproxy|passwall|passwall2|mosdns|argon-config|filetransfer|autoreboot|vlmcsd|frpc)|sing-box|luci-theme-argon|vlmcsd|frpc|mosdns|xray-core|v2ray-plugin|frps)=y" .config; then
            echo "!! a plugin sneaked in on a MINIMAL build:"
            grep -E "^CONFIG_PACKAGE_(luci-app-(homeproxy|passwall|passwall2|mosdns|argon-config|filetransfer|autoreboot|vlmcsd|frpc)|sing-box|luci-theme-argon|vlmcsd|frpc|mosdns|xray-core|v2ray-plugin|frps)=y" .config
            exit 1
          fi
          echo "  OK  no plugins"

      - name: Restore downloads cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: lean-min-dl-${{ github.run_id }}
          restore-keys: |
            lean-min-dl-
            lean-dl-

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j16
          find dl -size -1kc -delete || true
          make download -j16

      - name: Save downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: lean-min-dl-${{ github.run_id }}

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/toolchain
          key: lean3-toolchain-${{ github.run_id }}
          restore-keys: |
            lean3-toolchain-

      - name: "Fix mac80211 Werror (kernel 6.18 namespace signature mismatch)"
        working-directory: openwrt
        run: |
          python3 - <<'PYEOF'
          p = 'package/kernel/mac80211/Makefile'
          s = open(p).read()
          old = 'EXTRA_CFLAGS="-I$(PKG_BUILD_DIR)/include $(IREMAP_CFLAGS) $(C_DEFINES)"'
          new = 'EXTRA_CFLAGS="-I$(PKG_BUILD_DIR)/include $(IREMAP_CFLAGS) $(C_DEFINES) -Wno-error=incompatible-pointer-types"'
          assert old in s, '!! EXTRA_CFLAGS pattern not found - upstream Makefile changed, patch needs review'
          open(p, 'w').write(s.replace(old, new, 1))
          print('patched mac80211 Makefile: -Wno-error=incompatible-pointer-types')
          PYEOF
          grep -n 'Wno-error=incompatible-pointer-types' package/kernel/mac80211/Makefile

      - name: Compile
        working-directory: openwrt
        run: |
          make -j$(nproc) || {
            echo "parallel build failed, retrying once"
            make -j$(nproc) || {
              echo "still failed, capture single-threaded log"
              make -j1 V=s > ../build.log 2>&1 || true
              tail -n 120 ../build.log
              exit 1
            }
          }
          df -h /

      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/toolchain
          key: lean3-toolchain-${{ github.run_id }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-min-build-log-${{ github.run_number }}
          path: |
            build.log
            openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect output
        run: |
          STAMP=$(date +%Y%m%d-%H%M)
          mkdir -p out
          cp -r openwrt/bin/targets/mediatek/filogic/* out/
          rm -rf out/packages out/sha256sums out/config.buildinfo out/feeds.buildinfo out/manifest out/version.buildinfo
          for f in out/*; do mv "$f" "out/${STAMP}-LEANMIN-${f##*/}"; done
          ls -lh out/
          test -n "$(find out -maxdepth 1 -type f -print -quit)" || { echo "!! no firmware files in out/, abort"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax3000t-lean-min-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lean-min-build-${{ github.run_number }}
          name: AX3000T LEDE 纯净版(零插件) build-${{ github.run_number }}
          body: |
            Lean (coolsnowwolf/lede) master 源码 + 原生大分区设备 xiaomi_mi-router-ax3000t。
            纯净版：只保留 LuCI 基础界面 + 中文，零插件。
            目的：验证"去掉全部插件后能否正常启动"。
            - sysupgrade.bin : 系统内升级用（Lean 原生大分区）
          files: out/*
          make_latest: false
          fail_on_unmatched_files: true
